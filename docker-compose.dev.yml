# Developer conveniences: hot reload and explicit host ports. Never use this override on the
# public server because it exposes PostgreSQL and bypasses the production image targets.
services:
  postgres:
    ports: ["5432:5432"]

  backend:
    build:
      target: development
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    # A fresh development database must be usable after the documented single `up` command.
    command:
      - sh
      - -c
      - uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ${BACKEND_CONTEXT:-../market-backend}:/app
    ports: ["8000:8000"]

  frontend:
    build:
      target: test
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "7000"]
    volumes:
      - ${FRONTEND_CONTEXT:-../market-frontend}:/app
      - frontend_node_modules:/app/node_modules
    ports: ["7000:7000"]

volumes:
  frontend_node_modules:
