# Production edge proxy. TLS is terminated with a Cloudflare Origin Certificate mounted
# from the deployment host; the private key must never be stored in this repository.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    upstream market_backend {
        server backend:8000;
    }

    upstream market_frontend {
        server frontend:7000;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # Container-only health endpoint. Port 8080 is not published by Compose, so public HTTP
    # traffic on port 80 can remain redirect-only without requiring the origin CA in wget.
    server {
        listen 8080;

        location = /healthz {
            access_log off;
            proxy_pass http://market_backend/api/v1/health/live;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        client_max_body_size 10m;

        ssl_certificate /etc/nginx/tls/cloudflare-origin.pem;
        ssl_certificate_key /etc/nginx/tls/cloudflare-origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # This endpoint verifies the complete public proxy -> backend path and is used by
        # Docker, Jenkins and external smoke tests.
        location = /healthz {
            access_log off;
            proxy_pass http://market_backend/api/v1/health/live;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Product image URLs returned by the backend are rooted at /uploads/.
        location /uploads/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Keep FastAPI's interactive contract visible for operations and integration work.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://market_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://market_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
