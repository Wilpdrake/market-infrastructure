# Production-only runtime policy. The base file remains useful for CI validation and local
# integration tests, while this override adds automatic recovery and bounded log growth.
services:
  postgres:
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUDFLARE_ORIGIN_CERT_PATH:-/etc/market/tls/cloudflare-origin.pem}:/etc/nginx/tls/cloudflare-origin.pem:ro
      - ${CLOUDFLARE_ORIGIN_KEY_PATH:-/etc/market/tls/cloudflare-origin.key}:/etc/nginx/tls/cloudflare-origin.key:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
