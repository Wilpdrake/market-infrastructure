# Production edge proxy behind Cloudflare (Full/strict).
# Cloudflare terminates client TLS at its edge and re-establishes TLS to this
# origin on port 443 using a Cloudflare Origin Certificate mounted from the
# deployment host. Plain HTTP (80) is intentionally NOT published: Cloudflare
# handles the HTTP->HTTPS redirect at its edge. Port 8080 is container-internal
# only and used by the Docker healthcheck, so it never needs the origin CA.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    upstream market_backend {
        server backend:8000;
    }

    upstream market_frontend {
        server frontend:7000;
    }

    # Internal health endpoint. Not published; reached only by Docker's healthcheck
    # via http://127.0.0.1:8080/healthz (no TLS, no CA needed).
    server {
        listen 8080;

        location = /healthz {
            access_log off;
            proxy_pass http://market_backend/api/v1/health/live;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        client_max_body_size 10m;

        ssl_certificate /etc/nginx/tls/cloudflare-origin.pem;
        ssl_certificate_key /etc/nginx/tls/cloudflare-origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Keep browsers on HTTPS (Cloudflare enforces this at the edge too).
        add_header Strict-Transport-Security "max-age=63072000" always;

        # This endpoint verifies the complete public proxy -> backend path and is used by
        # Docker, Jenkins and external smoke tests.
        location = /healthz {
            access_log off;
            proxy_pass http://market_backend/api/v1/health/live;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Product image URLs returned by the backend are rooted at /uploads/.
        location /uploads/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Keep FastAPI's interactive contract visible for operations and integration work.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://market_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://market_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
