# The only public entry point. Browsers see one origin on port 80; Nginx sends API traffic
# to FastAPI and everything else to the Vue SPA container.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    upstream market_backend {
        server backend:8000;
    }

    upstream market_frontend {
        server frontend:7000;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        # This endpoint verifies the complete public proxy -> backend path and is used by
        # Docker, Jenkins and external smoke tests.
        location = /healthz {
            access_log off;
            proxy_pass http://market_backend/api/v1/health/live;
        }

        # Product image URLs returned by the backend are rooted at /uploads/.
        location /uploads/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Keep FastAPI's interactive contract visible for operations and integration work.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://market_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://market_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}