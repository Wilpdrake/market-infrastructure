# Базовый (общий) compose. Секреты берутся из .env (gitignored) или из окружения CI.
# Локально: cp .env.example .env && docker compose up -d
# Прод:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
    nginx:
        image: nginx:alpine-slim
        ports:
        - "80:80"
        volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
        - frontend
        - backend

    backend:
        build:
            context: ../market-backend
            dockerfile: Dockerfile
            target: production
        restart: always
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            ENVIRONMENT: production
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            SECRET_KEY: ${BACKEND_SECRET_KEY}
            FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL}
            FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
            FIRST_SUPERUSER_NAME: ${FIRST_SUPERUSER_NAME:-Admin}
            FIRST_SUPERUSER_SURNAME: ${FIRST_SUPERUSER_SURNAME:-Administrator}
        command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
            interval: 10s
            timeout: 3s
            retries: 10

    frontend:
        build:
            context: ${FRONTEND_CONTEXT:-../market-frontend}
            dockerfile: Dockerfile
            target: production

    postgres:
        image: postgres:18
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
        - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
