# Базовый (общий) compose. Секреты берутся из .env (gitignored) или из окружения CI.
# Локально: cp .env.example .env && docker compose up -d
# Прод:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
    nginx:
        image: nginx:alpine-slim
        ports:
        - "80:80"
        volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
        - frontend

    backend:
        build: ./market-backend
        restart: always
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    frontend:
        build: ./market-frontend

    postgres:
        image: postgres:18
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
        - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
