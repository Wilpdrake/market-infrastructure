services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Expose to the host so a backend running outside Docker (uv, not the
      # container) can reach it. Bind to localhost only — never publish 5432.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../market-backend}
      target: production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      UPLOAD_DIR: /app/uploads
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-wilpdrake}
      FIRST_SUPERUSER_ROLE: ${FIRST_SUPERUSER_ROLE:-developer}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      FIRST_SUPERUSER_NAME: ${FIRST_SUPERUSER_NAME:-Admin}
      FIRST_SUPERUSER_SURNAME: ${FIRST_SUPERUSER_SURNAME:-Administrator}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-market_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:?TBANK_TERMINAL_KEY is required}
      TBANK_PASSWORD: ${TBANK_PASSWORD:?TBANK_PASSWORD is required}
      TBANK_API_URL: ${TBANK_API_URL:-https://securepay.tinkoff.ru/v2}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:?TBANK_SUCCESS_URL is required}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:?TBANK_FAIL_URL is required}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:?TBANK_NOTIFICATION_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../market-frontend}
      target: production
      args:
        # Empty origin means browser requests stay on the public Nginx host.
        VITE_API_BASE_URL: ""
        VITE_API_VERSION: v1
        VITE_PUBLIC_PRODUCTS_PATH: products
        VITE_FRONTEND_ONLY: "false"
    expose: ["7000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: ${BOT_CONTEXT:-../market-bot}
      target: production
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUDFLARE_ORIGIN_CERT_PATH:-/etc/market/tls/cloudflare-origin.pem}:/etc/nginx/tls/cloudflare-origin.pem:ro
      - ${CLOUDFLARE_ORIGIN_KEY_PATH:-/etc/market/tls/cloudflare-origin.key}:/etc/nginx/tls/cloudflare-origin.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  product_uploads:
