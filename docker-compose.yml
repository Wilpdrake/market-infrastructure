# Production-shaped base topology. Local-only port publishing and source mounts belong in
# docker-compose.dev.yml; server hardening belongs in docker-compose.prod.yml.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # PostgreSQL 18 stores versioned data below this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [market]

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../market-backend}
      target: production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-wilpdrake}
      FIRST_SUPERUSER_ROLE: ${FIRST_SUPERUSER_ROLE:-developer}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      FIRST_SUPERUSER_NAME: ${FIRST_SUPERUSER_NAME:-Admin}
      FIRST_SUPERUSER_SURNAME: ${FIRST_SUPERUSER_SURNAME:-Administrator}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-market_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [market]

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../market-frontend}
      target: production
      args:
        # Empty origin means browser requests stay on the public Nginx host.
        VITE_API_BASE_URL: ""
        VITE_API_VERSION: v1
        VITE_PUBLIC_PRODUCTS_PATH: products
        VITE_FRONTEND_ONLY: "false"
    expose: ["7000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [market]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [market]

volumes:
  postgres_data:

networks:
  market:
    driver: bridge